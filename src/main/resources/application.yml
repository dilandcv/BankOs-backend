server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: bankos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankos}
    username: ${DB_USERNAME:bankos}
    password: ${DB_PASSWORD:bankos}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: false

app:
  jwt:
    issuer: ${JWT_ISSUER:bankos}
    secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  webhooks:
    dispatch-interval-ms: ${WEBHOOK_DISPATCH_INTERVAL_MS:5000}
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:8}
    timeout-ms: ${WEBHOOK_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.bankos: INFO
    org.hibernate.SQL: WARN
