services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bankos}
      POSTGRES_USER: ${DB_USERNAME:-bankos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bankos}
    ports:
      - "${DB_PORT:-5433}:5433"
    volumes:
      - bankos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bankos} -d ${DB_NAME:-bankos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bankos}
      DB_USERNAME: ${DB_USERNAME:-bankos}
      DB_PASSWORD: ${DB_PASSWORD:-bankos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef0123456789abcdef}
      JWT_ISSUER: ${JWT_ISSUER:-bankos}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 10

volumes:
  bankos-postgres:
